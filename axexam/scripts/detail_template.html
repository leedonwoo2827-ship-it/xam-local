<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/axnav.css">
<style>
/* 자격증 상세 — 랜딩과 문제풀이 사이의 중간 계층 */
.dt-hero{ background:linear-gradient(150deg,var(--navy-800),var(--navy-600)); color:#fff;
  padding:52px 0 56px; }
.dt-hero .eyebrow{ font-size:12.5px; font-weight:700; letter-spacing:.06em;
  color:var(--yellow); margin-bottom:12px; }
.dt-hero h1{ color:#fff; font-size:36px; letter-spacing:-.03em; margin:0 0 14px; }
.dt-hero p{ color:#c4cee8; font-size:16px; line-height:1.7; margin:0 0 26px; max-width:36em; }
.dt-cta{ display:flex; gap:10px; flex-wrap:wrap; }
.dt-facts{ display:flex; gap:28px; margin-top:30px; padding-top:24px;
  border-top:1px solid rgba(255,255,255,.14); flex-wrap:wrap; }
.dt-fact b{ display:block; font-size:22px; font-weight:800; letter-spacing:-.02em; color:#fff; }
.dt-fact span{ font-size:12.5px; color:#94a3c6; }

.rd-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.rd-card{ background:#fff; border:1px solid var(--hairline); border-radius:var(--r-lg);
  padding:18px 20px; display:flex; flex-direction:column; gap:11px; }
.rd-top{ display:flex; align-items:center; gap:9px; }
.rd-top b{ font-size:16px; color:var(--ink); }
.rd-n{ margin-left:auto; font-size:12.5px; color:var(--muted); }
.rd-links{ display:flex; gap:7px; }
.rd-links a{ flex:1; text-align:center; font-size:13px; font-weight:700; padding:9px 0;
  border-radius:var(--r-sm); border:1px solid var(--hairline-strong); color:var(--ink); }
.rd-links a.solve{ background:var(--blue-600); border-color:var(--blue-600); color:#fff; }
.rd-links a.mute{ color:var(--faint); border-style:dashed; pointer-events:none; }

.th-row{ display:flex; gap:12px; flex-wrap:wrap; }
.th-row a{ display:inline-flex; align-items:center; gap:9px; background:#fff;
  border:1px solid var(--hairline); border-radius:var(--r-lg); padding:15px 20px;
  font-size:14.5px; font-weight:700; color:var(--ink); }
.th-row a:hover{ border-color:var(--blue-500); background:var(--blue-50); }

.dt-foot{ background:var(--gray-900); color:#8e99b3; padding:34px 0; font-size:13px; text-align:center; }
.dt-foot a{ color:#8e99b3; margin:0 10px; }
.dt-foot a:hover{ color:#cdd6ea; }

@media (max-width:1024px){ .rd-grid{ grid-template-columns:repeat(2,1fr); } .dt-hero h1{ font-size:29px; } }
@media (max-width:640px){ .rd-grid{ grid-template-columns:1fr; } .dt-hero h1{ font-size:24px; } }
</style>
</head>
<body>

<!-- ═══ 공용 네비 — index.html · check.html · theme/axexam/head.php 와 동일 마크업 ═══ -->
<header class="axnav">
  <div class="axnav-in">
    <a class="axnav-logo" href="/exam/">{{BRAND_HTML}}</a>
    <!-- ★ 랜딩·상세는 정적 빌드라 PHP 의 theme/axexam/head.php 를 쓰지 않는다.
         각자 자기 내비를 갖고 있어서, head.php 만 고치면 이 두 화면만 옛 내비가 남는다
         (실제로 그렇게 걸렸다). 문제집 항목은 아래 fillNav() 가 채운다. -->
    <nav class="axnav-main" id="navMain">
      <a class="axnav-item" href="/exam/buy.php"><svg class="ic"><use href="#i-cap"></use></svg>수강 신청</a>
      <a class="axnav-item" href="/exam/report.php?pd={{PD}}&amp;sample=1"><svg class="ic"><use href="#i-chart"></use></svg>성적표 샘플</a>
    </nav>
    <!-- data-authswap: ui.js 가 api/me.php 를 보고 우측을 갈아끼운다 (정적 파일이라 서버가 못 그린다) -->
    <nav class="axnav-util" data-authswap="1">
      <a class="axnav-item" href="/bbs/board.php?bo_table=notice"><svg class="ic"><use href="#i-bell"></use></svg>공지</a>
      <a class="axnav-item" href="/bbs/qalist.php"><svg class="ic"><use href="#i-help"></use></svg>문의</a>
      <span class="axnav-sep"></span>
      <span class="axnav-auth">
        <a class="axnav-item" href="/exam/mypage.php"><svg class="ic"><use href="#i-user"></use></svg>마이페이지</a>
        <a class="axnav-cta ghost" href="/bbs/register.php">회원가입</a>
        <a class="axnav-cta" href="/bbs/login.php">로그인</a>
      </span>
    </nav>
  </div>
</header>

<header class="dt-hero">
  <div class="wrap">
    <!-- 이 페이지는 detail.html 하나가 ?pd= 로 N개 문제집을 렌더한다.
         제목·숫자·과목을 하드코딩하지 않는다 — load() 가 API 로 채운다.
         아래 값은 JS 가 오기 전 한 프레임만 보이는 자리표시자다. -->
    <div class="eyebrow" id="dtEyebrow">{{BRAND}}</div>
    <h1 id="dtTitle">문제집</h1>
    <p id="dtDesc">정답과 해설 전문이 공개되어 있고, 채점하면 과목별 취약점을 정리해 드립니다.
       막히는 문제는 그 자리에서 질문하세요.</p>
    <div class="dt-cta">
      <a class="btn btn-yellow btn-lg" id="dtSolve" href="/exam/check.php?pd={{PD}}">문제 풀기</a>
      <a class="btn btn-ghost-dark btn-lg" id="dtBuy" href="/exam/buy.php?pd={{PD}}">수강 신청</a>
    </div>
    <div class="dt-facts" id="dtFacts"></div>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow">커리큘럼</div>
      <h2>회차별 모의고사</h2>
      <p>회차당 50문제. 과목·난이도로 좁혀 풀 수 있습니다.</p>
    </div>
    <div class="rd-grid" id="rdGrid"></div>
  </div>
</section>

<section class="section" style="background:var(--surface-soft)">
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow">이론</div>
      <h2>요약노트</h2>
      <p>과목별 핵심 개념 정리. 오답이 몰린 과목을 다시 볼 때 씁니다.</p>
    </div>
    <!-- 과목 목록도 API 에서 온다.
         예전에는 SQLD 의 두 과목이 여기 박혀 있었다 — 다른 문제집을 열면 거짓말이 된다.
         api/problems.php 가 이미 subjects[] 를 주므로 코드가 줄어든다. -->
    <div class="th-row" id="thRow"></div>
  </div>
</section>

<footer class="dt-foot">
  <div class="wrap">
    <a href="/exam/">문제집</a>
    <a href="/exam/buy.php?pd={{PD}}">수강 신청</a>
    <a href="/bbs/board.php?bo_table=notice">공지사항</a>
    <a href="/bbs/qalist.php">1:1 문의</a>
    <div style="margin-top:14px;color:#6f7a94">© 2026 {{BRAND}}</div>
  </div>
</footer>

<script src="assets/ui.js"></script>
<script>
/* 회차 카드 — 서버에서는 api/problems.php 의 rounds 를 쓰고,
   정적(file://)에서는 problems.js 로 떨어진다. 어느 쪽이든 흰 화면이 되지 않게 한다. */
const API = window.EXAM_API || "";
const PD  = new URLSearchParams(location.search).get('pd') || (window.EXAM_CFG&&EXAM_CFG.pd) || '';
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(r){
  return `<div class="rd-card">
    <div class="rd-top">
      <span class="icon-box sm soft"><svg class="ic ic-sm"><use href="#i-clipboard"></use></svg></span>
      <b>${esc(r.label || (r.no+'회'))}</b>
      <span class="rd-n">${r.count||0}문제</span>
    </div>
    <div class="rd-links">
      <a class="solve" href="/exam/check.php?pd=${encodeURIComponent(PD)}&m=quiz&rd=${r.no}">문제 풀기</a>
      <a class="mute">영상 준비 중</a>
    </div>
  </div>`;
}

function fact(n, l){ return `<div class="dt-fact"><b>${n}</b><span>${esc(l)}</span></div>`; }

/* 상단 내비의 문제집 항목 — api/products.php 로 채운다.
   ★ 이 화면은 정적 빌드라 서버가 내비를 그리지 못한다. PHP 화면(head.php)과 같은 모습이
     되어야 이동해도 흔들리지 않는다. 지금 보고 있는 품목은 진하게 표시한다. */
async function fillNav(){
  const nav = document.getElementById("navMain");
  if(!nav || !API) return;
  try{
    const j = await (await fetch(API+"products.php", {credentials:"same-origin"})).json();
    if(!j || !j.ok || !Array.isArray(j.items)) return;
    const esc = s => String(s==null?"":s).replace(/[&<>"]/g,
      c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const html = j.items.filter(p => p.open).map(p =>
      '<a class="axnav-item' + (p.pd_id === PD ? ' on' : '') + '"'
      + ' href="/exam/check.php?pd=' + encodeURIComponent(p.pd_id) + '">'
      + '<svg class="ic"><use href="#i-edit"></use></svg>' + esc(p.name) + '</a>').join("");
    if(html) nav.insertAdjacentHTML("afterbegin", html);
  }catch(e){ /* 정적 모드 — 수강 신청·성적표 샘플만 남는다 */ }
}

async function load(){
  fillNav();
  /* 링크에 pd 를 반영한다 — {{PD}}(빌드 품목)로 구워졌으니 ?pd= 로 들어온 값으로 덮는다.
     이걸 안 하면 detail.html?pd=bdae-w 의 '문제 풀기' 가 SQLD 로 간다. */
  if(PD){
    document.getElementById("dtSolve").href = "/exam/check.php?pd="+encodeURIComponent(PD);
    document.getElementById("dtBuy").href   = "/exam/buy.php?pd="+encodeURIComponent(PD);
  }

  let rounds = null, subjects = [], name = "", videos = 0;

  if(API){
    try{
      const j = await (await fetch(API+"problems.php?pd="+encodeURIComponent(PD),
                                   {credentials:"same-origin"})).json();
      if(j && j.ok){
        if(j.rounds && j.rounds.length) rounds = j.rounds;
        if(j.subjects) subjects = j.subjects;
        if(j.product && j.product.pd_name) name = j.product.pd_name;
      }
    }catch(e){}
  }

  /* 정적 폴백 — EXAM_CFG.product(빌드가 주입) 또는 problems.js */
  const cfgp = (window.EXAM_CFG && EXAM_CFG.product) || null;
  if(!name && cfgp && cfgp.pd_name) name = cfgp.pd_name;
  if(!subjects.length && cfgp && cfgp.subjects) subjects = cfgp.subjects;

  if(!rounds){
    const P = window.PROBLEMS || [];
    const m = {};
    P.forEach(p => { const n = p.round_num || 0; if(n) m[n] = (m[n]||0)+1; });
    rounds = Object.keys(m).sort((a,b)=>a-b).map(n => ({no:+n, label:n+'회 모의고사', count:m[n]}));
  }

  /* 제목·설명 — 문제집 이름에서 만든다. 이름을 못 받았으면 일반 문구로 둔다. */
  if(name){
    document.title = name + " 문제집";
    document.getElementById("dtTitle").textContent = name + " 문제집";
    document.getElementById("dtEyebrow").textContent = name;
  }

  const tot = rounds.reduce((s,r)=>s+(r.count||0),0);
  if(tot){
    document.getElementById("dtDesc").textContent =
      `모의고사 ${rounds.length}회차 ${tot}문제. 정답과 해설 전문이 공개되어 있고, `
      + "채점하면 과목별 취약점을 정리해 드립니다. 막히는 문제는 그 자리에서 질문하세요.";
  }

  /* 숫자 칸 — 있는 것만 그린다. '30 해설 영상' 처럼 없는 숫자를 박아두지 않는다. */
  document.getElementById("dtFacts").innerHTML =
      (tot ? fact(tot, "문제") : "")
    + (rounds.length ? fact(rounds.length, "회차") : "")
    + (subjects.length ? fact(subjects.length, "과목") : "");

  document.getElementById("rdGrid").innerHTML = rounds.length
    ? rounds.map(card).join("")
    : '<div class="empty">아직 등록된 회차가 없습니다. 준비 중입니다.</div>';

  /* 과목별 이론 링크 */
  const th = document.getElementById("thRow");
  th.innerHTML = subjects.length
    ? subjects.map(s =>
        `<a href="/exam/check.php?pd=${encodeURIComponent(PD)}&m=theory">`
        + `<svg class="ic"><use href="#i-book"></use></svg>`
        + `${s.sj_no ? s.sj_no+'과목 · ' : ''}${esc(s.sj_name)}</a>`).join("")
    : '<div class="empty">과목 정보가 아직 없습니다.</div>';
}
load();
</script>
</body>
</html>
